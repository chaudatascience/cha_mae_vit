## Choose a dataset for training
training_dataset: chammiv1  ## choices: {chammiv1, jumpcp, so2sat}. 

########## CHAMMI Dataset
chammiv1:
  root_dir: /projectnb/morphem/data_70k/ver2/morphem_70k_version2
  csv_path: /projectnb/morphem/data_70k/ver2/morphem_70k_version2/morphem70k_v2.csv ## metadata can be found in `assets/morphem70k_v2.csv`
  num_classes: 14 
  in_chans: 12 
  img_size: [224, 224]
  collate_fn_name: padding  ## pad images to the max number of channels (i.e., 5 channels). Refer to `morphem70k_collate_with_padding()` in `dataset/chammiv1.py` for more details.
  channel_ids: 
    Allen:
      - 0 # nucleus 
      - 1 # membrane 
      - 2 # protein 
    HPA:
      - 3 # microtubules 
      - 4 # protein 
      - 5 # nucleus 
      - 6 # endoplasmic reticulum 
    CP:
      - 7 # nucleus 
      - 8 # endoplasmic reticulum 
      - 9 # RNA
      - 10 # golgi body 
      - 11  # mitochondria 
  normalization:
    use_mean_std: True # if False, do nothing (only scale from [0-255] to [0-1])
    Allen:
      mean: [0.17299628, 0.21203272, 0.06717163]
      std: [0.31244728, 0.33736905, 0.15192129]
    HPA:
      mean:  [0.08290479, 0.041127298, 0.064044416, 0.08445485]
      std:  [0.16213107, 0.1055938, 0.17713426, 0.1631108]
    CP:
      mean:  [0.09957531, 0.19229747, 0.16250895, 0.1824028, 0.14978175]
      std:   [0.1728119, 0.16629605, 0.15171643, 0.14863704, 0.1524553]


########### JUMP-CP Dataset
